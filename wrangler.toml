# Cloudflare Worker: serves public/ and the API in worker/index.js on D1.
name = "pickup-rotation"
main = "worker/index.js"
compatibility_date = "2025-06-01"

[assets]
directory = "public"

[[d1_databases]]
binding = "DB"
database_name = "pickup"
database_id = "00000000-0000-0000-0000-000000000000" # replaced by the id from `wrangler d1 create pickup`
