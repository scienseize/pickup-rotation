# Cloudflare Worker: serves public/ and the API in worker/index.js on D1.
name = "pickup-rotation"
main = "worker/index.js"
compatibility_date = "2025-06-01"

[assets]
directory = "public"

[[d1_databases]]
binding = "DB"
database_name = "pickup"
database_id = "03feea7f-b4b5-48e9-9f3a-110c14da278a"
