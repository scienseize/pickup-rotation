<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hexagames</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<style>
/* The home page: the ISO logo, a way in for organizers, and the passcode form once they ask
   for it. Served without a session (with the logo and tab icon), so it has its own copy of the
   few tokens it needs. Keep them in step with app.html. */
:root{
  --bg:#faf8f5; --panel:#f1ede8; --card:#ffffff; --line:#e6e1dc; --ink:#1c1a19; --tx:#3d3936; --mu:#77706a; --faint:#d6d0ca;
  --btn:#1c1a19; --btn-tx:#faf8f5; --logo:.14;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a19; --panel:#252321; --card:#2b2927; --line:#36332f; --ink:#f3efea; --tx:#d9d3cd; --mu:#a39c95; --faint:#4a4642;
  --btn:#f3efea; --btn-tx:#1b1a19; --logo:.2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1a19; --panel:#252321; --card:#2b2927; --line:#36332f; --ink:#f3efea; --tx:#d9d3cd; --mu:#a39c95; --faint:#4a4642;
  --btn:#f3efea; --btn-tx:#1b1a19; --logo:.2; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:24px 16px;overflow:hidden}
/* The organization's logo as the backdrop: large, centered, faint. */
.backdrop{position:fixed;inset:0;margin:auto;width:min(96vmin,1000px);height:auto;opacity:var(--logo);pointer-events:none;user-select:none}
.card{position:relative;width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 28px;display:flex;flex-direction:column;gap:14px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:0}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,6vw,40px);line-height:1.05;letter-spacing:-.02em;color:var(--ink);margin:0}
p{margin:0}
form{display:flex;flex-direction:column;gap:12px;margin-top:6px}
label{font-size:14px;color:var(--ink);font-weight:500}
.in{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;width:100%}
.in:focus{outline:2px solid var(--ink);outline-offset:3px}
.btn{border:0;cursor:pointer;font:500 16px/1.2 var(--sans);background:var(--btn);color:var(--btn-tx);padding:13px 22px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#msg{min-height:1.5em;font-size:15px;color:var(--ink);font-weight:500}
#msg:empty{display:none}
a.btn{text-align:center;text-decoration:none;margin-top:6px}
.note{color:var(--mu);font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.card{animation:in .3s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<img class="backdrop" src="logo.png" alt="" aria-hidden="true">
<main class="card">
  <p class="kicker">ISO</p>
  <h1>Hexagames</h1>
  <!-- Signed-in devices go straight in; anyone else gets the passcode box right here, no reload. -->
  <a class="btn" id="enter" href="/app" aria-controls="signin">Enter as organizer</a>
  <form id="signin" hidden>
    <label for="pass">Organizer passcode</label>
    <input class="in" id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" id="go" type="submit">Sign in</button>
    <p id="msg" role="alert"></p>
    <p class="note">This laptop or phone stays signed in for 30 days.</p>
  </form>
</main>
<script src="signin.js"></script>
</body>
</html>
