# Backs up the live database to the `backups` branch of this repo.
# Runs daily but only commits when the data changed, so every game night ends up
# in git history. Needs the CLOUDFLARE_API_TOKEN secret (D1 Edit) and the
# CLOUDFLARE_ACCOUNT_ID variable. GitHub emails the repo owner if a run fails.
name: Database backup

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Export the live database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export pickup --remote --output "$RUNNER_TEMP/pickup.sql"

      - uses: actions/checkout@v5
        with:
          ref: backups
          path: store

      - name: Commit it if anything changed
        working-directory: store
        run: |
          cp "$RUNNER_TEMP/pickup.sql" pickup.sql
          git add pickup.sql
          if git diff --cached --quiet; then echo "No changes since the last backup."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Backup $(date -u +%F)"
          git push
